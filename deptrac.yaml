deptrac:
  paths:
    - ./app
    - ./src

  exclude_files:
    - '#.*Migrations.*#'

  layers:
    - name: Domain
      collectors:
        - type: classLike
          value: ^Sokol\\Domain\\.*

    - name: Application
      collectors:
        - type: classLike
          value: ^Sokol\\Application\\.*

    - name: Infrastructure
      collectors:
        - type: classLike
          value: ^Sokol\\Infrastructure\\.*

    - name: Presentation
      collectors:
        - type: classLike
          value: ^App\\.*

    - name: Framework
      collectors:
        - type: classLike
          value: ^(Illuminate|Carbon|Symfony|Psr)\\.*

  ruleset:
    Domain: ~
    Application:
      - Domain
    Infrastructure:
      - Domain
      - Framework
    Presentation:
      - Application
      - Domain
      - Framework
    Framework: ~
